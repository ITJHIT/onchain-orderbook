name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -v
      # Determinism is the product here, so the suite runs repeatedly and under
      # the race detector: a root that only usually matches is a chain that only
      # usually reaches consensus.
      - name: test (race, repeated)
        run: go test ./... -race -count=5
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
